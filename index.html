<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Davila's Donuts | Contacto Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
  
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; /* Centrar verticalmente el contenedor */
      color: #3b1d14;
      background-color: #2b150e; /* Fondo oscuro base */
      position: relative;
      padding: 20px;
    }

    /* Fondo con imagen difuminada (SOLO IMAGEN, SIN TEXTURAS EXTRA) */
    .bg-image {
      position: fixed;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=900&q=80');
      background-size: cover;
      background-position: center;
      filter: blur(6px) brightness(0.65); /* Más difuminado y oscuro para mejor contraste */
      transform: scale(1.15);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 420px; /* Contenedor un poco más estrecho */
      padding: 36px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px; /* Separación general entre elementos */
    }

    /* Logo circular */
    .logo-wrap {
      width: 130px; /* Un poco más grande */
      height: 130px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #f4ece1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      margin-bottom: 10px;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      color: #fff8f0;
      font-size: 1.8rem; /* Título más grande y elegante */
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 3px 10px rgba(0,0,0,0.5);
    }

    /* BLOQUE DE HORARIO INTEGRADO */
    .schedule-block {
      width: 100%;
      color: #f4ece1; /* Color claro para el texto */
      text-align: center;
      padding: 15px 10px;
      border-top: 1px solid rgba(244, 236, 225, 0.3);
      border-bottom: 1px solid rgba(244, 236, 225, 0.3);
      margin-bottom: 10px;
    }

    .schedule-title {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .schedule-hours, .schedule-location {
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0.9;
    }

    /* Tarjetas de acción (Botones limpios) */
    .card {
      width: 100%;
      background: rgba(244, 236, 225, 0.60);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: #3b1d14;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .card:hover, .card:active {
      transform: scale(0.99);
      background: #ffffff;
    }

    .card-thumb {
      width: 36px; /* Iconos más pequeños y limpios */
      height: 36px;
      flex-shrink: 0;
    }

    .card-text {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Botón principal de WhatsApp */
    .card-whatsapp {
      background: #25D366;
      color: #ffffff;
    }

    .card-whatsapp:hover, .card-whatsapp:active {
      background: #20bd5a;
    }

    .whatsapp-icon {
       width: 413-px;
       height: 40px;
    }

    /* Contenedor para redes sociales y ubicación (Grid de 2 columnas) */
    .social-location-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .card-social, .card-location {
      justify-content: center;
      padding: 16px 10px;
      flex-direction: column;
      gap: 8px;
      text-align: center;
    }

    /* Firma discreta */
    .footer {
      margin-top: 28px;
      font-size: 0.65rem;
      color: rgba(255, 248, 240, 0.7);
      text-decoration: none;
      letter-spacing: 0.3px;
    }

    .footer span {
      font-weight: 700;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>

  <main class="container">
    <!-- LOGO DEL NEGOCIO -->
    <div class="logo-wrap">
      <img src="davilasLogo.jpg" alt="Davila's Donuts Logo"> <!-- Usando el logo original -->
    </div>
    <h1 class="brand-title">Davila's Donuts</h1>

    <!-- HORARIO INTEGRADO COMO TEXTO (Sin botones) -->
    <div class="schedule-block">
      <p class="schedule-title">HORARIO DE ATENCIÓN</p>
      <p class="schedule-hours">Lunes a Domingo · 14:00 - 22:00</p>
      <p class="schedule-location">Plaza Alianza</p>
    </div>

    <!-- BOTÓN PRINCIPAL DE WHATSAPP (Destacado) -->
    <a class="card card-whatsapp" href="https://wa.me/593988241584?text=Hola%20Davila's%20Donuts%2C%20vengo%20de%20su%20tarjeta%20y%20quiero%20hacer%20un%20pedido" target="_blank" rel="noopener noreferrer">

      <span class="card-text">RECEPTAMOS TU PEDIDO</span>
    </a>

    <!-- ENLACES A REDES SOCIALES Y UBICACIÓN (Diseño de rejilla) -->
    <div class="social-location-grid">
      <a class="card card-social" href="https://www.instagram.com/davilasdonuts/" target="_blank" rel="noopener noreferrer">
        <img class="card-thumb" src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">
        <span class="card-text">INSTAGRAM</span>
      </a>
      <a class="card card-social" href="https://www.facebook.com/davilasdonuts" target="_blank" rel="noopener noreferrer">
        <img class="card-thumb" src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook">
        <span class="card-text">FACEBOOK</span>
      </a>
    </div>
    
    <a class="card card-location" href="https://maps.app.goo.gl/tuLinkDeGoogleMapsAqui" target="_blank" rel="noopener noreferrer">
        <img class="card-thumb" src="https://cdn4.iconfinder.com/data/icons/small-n-flat/24/map-marker-512.png" alt="Ubicación">
        <span class="card-text">CÓMO LLEGAR (Plaza Alianza)</span>
    </a>

    <!--FIRMA -->
    <a class="footer" target="_blank">
      Diseñado por <span>EM Studio</span>
    </a>
  </main>
</body>
</html>
